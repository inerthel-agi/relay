<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Relay</title>
    <link rel="stylesheet" href="tray.css">
  </head>
  <body>
    <main class="tray-panel">
      <header class="tray-header">
        <img class="tray-logo" src="assets/relay-radar.png" alt="">
        <strong class="tray-brand">Relay</strong>
        <span id="relay-indicator" class="state-pill" role="status" aria-label="Relay status" data-i18n-aria="relayStatus">
          <i aria-hidden="true"></i>
          <span id="relay-state-label" data-i18n="checking">Checking</span>
        </span>
      </header>

      <section class="status-card" aria-label="Connection status" data-i18n-aria="connectionStatus">
        <div class="status-line">
          <span id="discord-dot" class="status-dot" aria-hidden="true"></span>
          <span class="status-line__copy">
            <strong data-i18n="discord">Discord</strong>
            <small id="discord-detail" data-i18n="connecting">Connecting…</small>
          </span>
          <span id="discord-status" class="status-line__value" data-i18n="checking">Checking</span>
        </div>
        <div class="status-line">
          <span id="server-dot" class="status-dot" aria-hidden="true"></span>
          <span class="status-line__copy">
            <strong data-i18n="localRelay">Local relay</strong>
            <small id="server-detail" data-i18n="zeroOutputs">0 outputs</small>
          </span>
          <span id="server-status" class="status-line__value" data-i18n="checking">Checking</span>
        </div>
      </section>

      <button id="tray-attention" class="attention-action" type="button" hidden>
        <span>
          <small id="tray-attention-label"></small>
          <strong id="tray-attention-action"></strong>
        </span>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4.5 12.5 10 7 15.5"></path></svg>
      </button>

      <div class="tray-actions">
        <button id="panic-toggle" class="panic-action" type="button">
          <svg id="panic-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 20h19L12 3Z"></path><path d="M12 9v5M12 17.2h.01"></path></svg>
          <svg id="resume-icon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M8 5v14l11-7z"></path></svg>
          <span id="panic-label" data-i18n="panic">Panic</span>
        </button>
        <button id="open-panel" class="open-panel" type="button">
          <span data-i18n="openPanel">Open control panel</span>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4.5 12.5 10 7 15.5"></path></svg>
        </button>
      </div>

      <section class="widget-section">
        <p class="section-label" data-i18n="displayWidgets">Display widgets</p>

        <article class="widget-row">
          <span class="widget-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="8.5" cy="10" r="1.5"></circle><path d="m21 16-5-5-8 8"></path></svg>
          </span>
          <span class="widget-copy">
            <strong data-i18n="mediaOverlay">Media overlay</strong>
            <small id="media-widget-state">Hidden</small>
          </span>
          <button id="lock-media-widget" class="icon-button" type="button" aria-label="Lock media widget">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path class="lock-shackle" d="M6.5 9V6.8a3.5 3.5 0 0 1 7 0V9"></path>
              <rect x="4.5" y="8.5" width="11" height="8" rx="2"></rect>
            </svg>
          </button>
          <button id="toggle-media-widget" class="switch-button" type="button" role="switch" aria-checked="false">
            <span class="switch-button__track" aria-hidden="true"></span>
            <span class="visually-hidden">Show</span>
          </button>
        </article>

        <article class="widget-row">
          <span class="widget-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5Z"></path><path d="M8 9h8M8 12.5h5"></path></svg>
          </span>
          <span class="widget-copy">
            <strong data-i18n="ttsNotifications">Message notifications</strong>
            <small id="notification-widget-state">Hidden</small>
          </span>
          <button id="lock-notification-widget" class="icon-button" type="button" aria-label="Lock notification widget">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path class="lock-shackle" d="M6.5 9V6.8a3.5 3.5 0 0 1 7 0V9"></path>
              <rect x="4.5" y="8.5" width="11" height="8" rx="2"></rect>
            </svg>
          </button>
          <button id="toggle-notification-widget" class="switch-button" type="button" role="switch" aria-checked="false">
            <span class="switch-button__track" aria-hidden="true"></span>
            <span class="visually-hidden">Show</span>
          </button>
        </article>
      </section>

      <footer class="tray-footer">
        <button id="toggle-startup" class="footer-switch" type="button" role="switch" aria-checked="false" aria-pressed="false">
          <span class="switch-button__track" aria-hidden="true"></span>
          <span data-i18n="startWithWindows">Start with Windows</span>
        </button>
        <button id="quit" class="footer-quit" type="button" data-i18n="quitRelay">Quit Relay</button>
      </footer>
    </main>
    <script src="tray.js" defer></script>
  </body>
</html>
