<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Relay</title>
    <link rel="stylesheet" href="tray.css">
  </head>
  <body>
    <main class="tray-panel">
      <header class="tray-header">
        <img class="tray-logo" src="assets/relay-radar.png" alt="">
        <div class="tray-brand">
          <strong>Relay</strong>
        </div>
        <span id="relay-indicator" class="relay-indicator" aria-label="Relay status" data-i18n-aria="relayStatus"></span>
      </header>

      <section class="status-rack" aria-label="Connection status" data-i18n-aria="connectionStatus">
        <div class="status-cell">
          <span class="status-label" data-i18n="discord">Discord</span>
          <strong id="discord-status" data-i18n="checking">Checking</strong>
          <small id="discord-detail" data-i18n="connecting">Connecting…</small>
        </div>
        <div class="status-cell">
          <span class="status-label" data-i18n="localRelay">Local relay</span>
          <strong id="server-status" data-i18n="checking">Checking</strong>
          <small id="server-detail" data-i18n="zeroOutputs">0 outputs</small>
        </div>
      </section>

      <button id="tray-attention" class="attention-action" type="button" hidden>
        <span>
          <small id="tray-attention-label"></small>
          <strong id="tray-attention-action"></strong>
        </span>
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M7 4.5 12.5 10 7 15.5"></path>
        </svg>
      </button>

      <button id="open-panel" class="primary-action" type="button">
        <span>
          <small data-i18n="system">System</small>
          <strong data-i18n="openPanel">Open control panel</strong>
        </span>
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M7 4.5 12.5 10 7 15.5"></path>
        </svg>
      </button>

      <section class="widget-section">
        <div class="section-label">
          <span data-i18n="displayWidgets">Display widgets</span>
          <small>Windows</small>
        </div>

        <article class="widget-row">
          <div class="widget-copy">
            <span class="widget-icon" aria-hidden="true">M</span>
            <span>
              <strong data-i18n="mediaOverlay">Media overlay</strong>
              <small id="media-widget-state">Hidden</small>
            </span>
          </div>
          <div class="widget-actions">
            <button id="toggle-media-widget" class="chip" type="button">Show</button>
            <button id="lock-media-widget" class="icon-button" type="button" aria-label="Lock media widget">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path class="lock-shackle" d="M6.5 9V6.8a3.5 3.5 0 0 1 7 0V9"></path>
                <rect x="4.5" y="8.5" width="11" height="8" rx="2"></rect>
              </svg>
            </button>
          </div>
        </article>

        <article class="widget-row">
          <div class="widget-copy">
            <span class="widget-icon widget-icon--signal" aria-hidden="true">T</span>
            <span>
              <strong data-i18n="ttsNotifications">Message notifications</strong>
              <small id="notification-widget-state">Hidden</small>
            </span>
          </div>
          <div class="widget-actions">
            <button id="toggle-notification-widget" class="chip" type="button">Show</button>
            <button id="lock-notification-widget" class="icon-button" type="button" aria-label="Lock notification widget">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path class="lock-shackle" d="M6.5 9V6.8a3.5 3.5 0 0 1 7 0V9"></path>
                <rect x="4.5" y="8.5" width="11" height="8" rx="2"></rect>
              </svg>
            </button>
          </div>
        </article>
      </section>

      <footer class="tray-footer">
        <span><i aria-hidden="true"></i> <span data-i18n="runningLocally">Running locally</span></span>
        <button id="toggle-startup" type="button" aria-pressed="false" data-i18n="startWithWindows">Start with Windows</button>
        <button id="quit" type="button" data-i18n="quitRelay">Quit Relay</button>
      </footer>
    </main>
    <script src="tray.js" defer></script>
  </body>
</html>
