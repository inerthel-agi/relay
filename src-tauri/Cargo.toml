[package]
name = "relay"
version = "1.3.6"
description = "Local Discord media relay for OBS"
authors = ["StealthyLabs <125747450+stealthsrc@users.noreply.github.com>"]
edition = "2024"

[lib]
name = "relay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
dotenvy = "0.15.7"
futures-util = "0.3.31"
kamadak-exif = "0.6.1"
keyring-core = "1.0.0"
lofty = "0.24.0"
minisign-verify = "0.2.5"
rand = "0.9.2"
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }
regex = "1.11"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serenity = { version = "0.12.5", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "native_tls_backend"] }
sha2 = "0.10.9"
subtle = "2.6.1"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.2"
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6.8", features = ["set-header", "trace"] }
windows = { version = "0.61.3", features = ["Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[dev-dependencies]
tempfile = "3.24.0"
tokio-tungstenite = "0.29.0"
