name: Feature request
description: Propose a focused Relay improvement.
title: "feature: "
body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem before suggesting an implementation.
        Relay remains local-first: do not propose cloud processing, telemetry, or unsafe arbitrary code without a clear security case.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who is affected and what cannot they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the observable result, constraints, and alternatives considered.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Privacy and safety impact
      description: Explain impact on Discord data, local outputs, permissions, moderation, and dependencies.
    validations:
      required: true
